<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00D1B2" />
    <!-- Apply the saved (or system) theme before first paint to avoid a flash. Keep the
         key/logic in sync with src/theme.js. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('careerpass_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="CareerPass — Civil Service Exam Reviewer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32">
    <link rel="icon" href="/favicon-16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>CareerPass</title>
    <!-- Boot splash: shown before main.js loads and React mounts, so there's no
         blank frame. React replaces #root's contents with the matching
         <SplashScreen>, then the real app — a seamless handoff. Keep visuals in
         sync with src/components/ui/SplashScreen.js. -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background: #f9fafb;
      }
      html.dark #boot-splash { background: #111827; }
      #boot-splash .bs-mark {
        display: flex; align-items: center; justify-content: center;
        width: 54px; height: 54px; border-radius: 10px; background: #00d1b2; gap: 4px;
        box-shadow: 0 12px 34px -10px rgba(0, 209, 178, 0.55);
      }
      #boot-splash .bs-bar {
        width: 4.6px; background: #fff; border-radius: 2.4px;
        transform-origin: bottom; transform: skewX(-14deg);
        animation: bs-rise 1.1s ease-in-out infinite;
      }
      #boot-splash .bs-bar:nth-child(1) { height: 16px; opacity: 0.55; animation-delay: 0s; }
      #boot-splash .bs-bar:nth-child(2) { height: 23px; opacity: 0.8; animation-delay: 0.15s; }
      #boot-splash .bs-bar:nth-child(3) { height: 29px; opacity: 1; animation-delay: 0.3s; }
      #boot-splash .bs-word {
        font: 700 24px/1 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: -0.035em; color: #00c4a7;
      }
      #boot-splash .bs-track {
        position: relative; width: 160px; height: 3px; border-radius: 999px;
        overflow: hidden; background: rgba(0, 209, 178, 0.15);
      }
      html.dark #boot-splash .bs-track { background: rgba(0, 209, 178, 0.25); }
      #boot-splash .bs-track > i {
        position: absolute; top: 0; bottom: 0; width: 40px; border-radius: 999px;
        background: #00d1b2; animation: bs-sweep 1.2s ease-in-out infinite;
      }
      @keyframes bs-rise {
        0%, 100% { transform: skewX(-14deg) scaleY(0.7); }
        50% { transform: skewX(-14deg) scaleY(1); }
      }
      @keyframes bs-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(420%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-bar, #boot-splash .bs-track > i { animation: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading CareerPass">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
          <div class="bs-mark">
            <span class="bs-bar"></span><span class="bs-bar"></span><span class="bs-bar"></span>
          </div>
          <span class="bs-word">CareerPass</span>
        </div>
        <div class="bs-track"><i></i></div>
      </div>
    </div>
  </body>
</html>
